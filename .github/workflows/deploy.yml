name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production hosting is Vercel Git Integration → https://jg-mart.vercel.app
# This workflow validates the toolkit. Optional Actions deploy runs only when
# VERCEL_TOKEN is configured (see step below).

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tests/validate_toolkit.py
        env:
          PYTHONIOENCODING: utf-8

  deploy-catalog:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for Vercel Actions secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_TOKEN secret — skipping CLI deploy."
            echo "Relying on Vercel Git Integration for https://jg-mart.vercel.app"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Vercel CLI
        if: steps.secrets.outputs.configured == 'true'
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings
        if: steps.secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build project artifacts
        if: steps.secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to production
        if: steps.secrets.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

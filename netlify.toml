[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/"
  to = "/src/web/catalog/index.html"
  status = 200

[[redirects]]
  from = "/catalog"
  to = "/src/web/catalog/index.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/src/web/catalog/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/src/web/catalog/landing.html"
  status = 200

[[redirects]]
  from = "/menu"
  to = "/src/web/catalog/menu.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/src/web/catalog/track.html"
  status = 200

[[redirects]]
  from = "/zone"
  to = "/src/web/catalog/zone.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/src/web/catalog/admin.html"
  status = 200

[[redirects]]
  from = "/manifest"
  to = "/src/web/catalog/manifest.html"
  status = 200

[[redirects]]
  from = "/myorders"
  to = "/src/web/catalog/myorders.html"
  status = 200

[[redirects]]
  from = "/healthcheck"
  to = "/src/web/catalog/healthcheck.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/src/web/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to = "/src/web/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/src/web/catalog/404.html"
  status = 404

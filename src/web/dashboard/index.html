<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00442D">
<title>JG Mart — Operations Dashboard</title>
<base href="/src/web/dashboard/">
<script src="/src/web/supabase/config.runtime.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f7f5; color: #1a1a1a; }
  .login-wrap, .main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
  h1 { color: #00442D; font-size: 1.4rem; margin-bottom: 4px; }
  h2 { font-size: 1rem; margin-bottom: 12px; }
  .muted { color: #666; font-size: .85rem; }
  input, button { font: inherit; }
  input { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; margin: 8px 0; }
  input.pin { text-align: center; letter-spacing: 4px; }
  button { background: #00442D; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: #f0fdf4; border-radius: 10px; padding: 14px; }
  .stat .val { font-size: 1.5rem; font-weight: 800; color: #00442D; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }
  .hidden { display: none; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  a { color: #00442D; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .75rem; background: #e8f5ef; color: #00442D; }
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="card" style="max-width:400px;margin:80px auto;text-align:center">
    <h1>JG Mart Ops</h1>
    <p class="muted" id="loginHint">Sign in with admin credentials</p>
    <div id="supabaseLogin">
      <input type="email" id="emailInput" placeholder="admin@jgmartbd.com" autocomplete="username">
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
      <button onclick="loginSupabase()" style="width:100%">Sign in</button>
    </div>
    <p class="muted" style="margin:16px 0 8px">— or PIN fallback —</p>
    <input type="password" id="pinInput" class="pin" maxlength="8" placeholder="PIN" onkeydown="if(event.key==='Enter')loginPin()">
    <button onclick="loginPin()" style="width:100%;background:#666;margin-top:8px">Unlock with PIN</button>
    <p id="loginError" class="muted" style="color:#c0392b;margin-top:12px;display:none"></p>
  </div>
</div>

<div id="mainView" class="main hidden">
  <div class="top">
    <div>
      <h1>Operations Dashboard</h1>
      <p class="muted">Orders from <span id="dataSource" class="badge">local</span></p>
    </div>
    <div>
      <a href="/">← Catalog</a>
      <a href="/admin" style="margin-left:12px">Admin</a>
      <button onclick="logout()" style="margin-left:8px;background:#666">Logout</button>
    </div>
  </div>

  <div class="stats card">
    <div class="stat"><div class="val" id="statOrders">0</div><div class="muted">Total orders</div></div>
    <div class="stat"><div class="val" id="statToday">0</div><div class="muted">Today</div></div>
    <div class="stat"><div class="val" id="statRevenue">৳0</div><div class="muted">Revenue (all)</div></div>
    <div class="stat"><div class="val" id="statPending">0</div><div class="muted">Pending</div></div>
  </div>

  <div class="card">
    <h2>Recent Orders</h2>
    <table>
      <thead><tr><th>ID</th><th>Customer</th><th>Building</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <p id="emptyOrders" class="muted hidden">No orders yet.</p>
  </div>
</div>

<script type="module">
import { isSupabaseConfigured } from '../supabase/config.js';
import { loadOrdersFromDB } from '../catalog/db.js';
import { supabase } from '../supabase/client.js';

const SESSION_KEY = 'jgmart_dash_auth';
const PIN_KEY = 'jgmart_admin_pin';
const DEFAULT_PIN = '1234';
const useSupabase = isSupabaseConfigured();

document.getElementById('dataSource').textContent = useSupabase ? 'Supabase' : 'localStorage';
if (!useSupabase) {
  document.getElementById('supabaseLogin').style.opacity = '0.5';
  document.getElementById('loginHint').textContent = 'Supabase not configured — use PIN';
}

function getPin() {
  return localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
}

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

window.loginPin = function loginPin() {
  const pin = document.getElementById('pinInput').value;
  if (pin === getPin()) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ mode: 'pin' }));
    showDashboard();
    showError('');
  } else {
    showError('Wrong PIN');
  }
};

window.loginSupabase = async function loginSupabase() {
  if (!useSupabase) {
    showError('Configure Supabase first (config.local.js)');
    return;
  }
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) {
    showError('Email and password required');
    return;
  }
  try {
    await supabase.signIn(email, password);
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ mode: 'supabase', email }));
    showError('');
    showDashboard();
  } catch (e) {
    showError(e.message || 'Login failed');
  }
};

window.logout = function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  if (useSupabase) supabase.signOut().catch(() => {});
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('mainView').classList.add('hidden');
};

async function loadOrders() {
  if (useSupabase && sessionStorage.getItem(SESSION_KEY)?.includes('supabase')) {
    return loadOrdersFromDB(50);
  }
  try {
    return JSON.parse(localStorage.getItem('jgmart_ords') || '[]');
  } catch {
    return [];
  }
}

async function renderOrders() {
  const orders = (await loadOrders()).slice().reverse();
  const today = new Date().toISOString().slice(0, 10);
  let revenue = 0;
  let todayCount = 0;
  let pending = 0;

  orders.forEach((o) => {
    revenue += Number(o.total || 0);
    const d = (o.date || o.created_at || '').slice(0, 10);
    if (d === today) todayCount++;
    if ((o.status || 'pending') === 'pending') pending++;
  });

  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statRevenue').textContent = '৳' + revenue.toLocaleString();
  document.getElementById('statPending').textContent = pending;

  const body = document.getElementById('ordersBody');
  const empty = document.getElementById('emptyOrders');
  if (!orders.length) {
    body.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  body.innerHTML = orders.slice(0, 50).map((o) => `
    <tr>
      <td>${o.id || o.order_number || '—'}</td>
      <td>${o.name || o.customerName || '—'}</td>
      <td>${o.building || o.customer_building || '—'} ${o.flat || o.customer_flat || ''}</td>
      <td>৳${o.total || 0}</td>
      <td>${o.status || 'pending'}</td>
      <td>${(o.date || o.created_at || '').slice(0, 16).replace('T', ' ')}</td>
    </tr>
  `).join('');
}

async function showDashboard() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  await renderOrders();
}

if (sessionStorage.getItem(SESSION_KEY)) {
  showDashboard();
}
</script>
</body>
</html>

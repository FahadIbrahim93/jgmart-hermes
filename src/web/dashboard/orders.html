<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JG Mart — Order Lifecycle Tracker</title>
<meta name="theme-color" content="#00442D">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f0f2f0;color:#1a1a1a;padding:16px;max-width:1100px;margin:0 auto;min-height:100vh}
/* ─── HEADER ─── */
.header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.header-row h1{color:#00442D;font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:8px}
.header-row h1 span{color:#c9a227}
.badge-live{background:#00442D;color:#fff;font-size:.6rem;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.03em}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#00442D;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.82rem;font-family:Inter;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:.75rem}
.btn-outline{background:transparent;color:#00442D;border:1.5px solid #00442D}
.btn-outline:hover{background:#00442D;color:#fff}
.btn-gold{background:#c9a227;color:#fff}
.btn-gold:hover{background:#b58d1f}
.btn-danger{background:#c0392b;color:#fff}
.btn-danger:hover{background:#a93226}
.btn-ghost{background:transparent;color:#5c5c5c;border:1px solid #ddd;padding:6px 12px;font-size:.75rem}
.btn-ghost:hover{background:#eee}
/* ─── KPI ROW ─── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.kpi-row{grid-template-columns:repeat(2,1fr);gap:6px}}
.kpi-card{background:#fff;border-radius:12px;padding:12px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.kpi-card .kpi-label{font-size:.65rem;color:#5c5c5c;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.kpi-card .kpi-value{font-size:1.3rem;font-weight:800;color:#00442D;margin-top:2px}
.kpi-card .kpi-value.gold{color:#c9a227}
.kpi-card .kpi-value.green{color:#0a6b47}
.kpi-card .kpi-value.red{color:#c0392b}
/* ─── TOOLBAR ─── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search-wrap{flex:1;min-width:160px;position:relative}
.search-wrap input{width:100%;font-family:Inter;padding:9px 12px 9px 34px;border:1.5px solid #ddd;border-radius:8px;font-size:.82rem;background:#fff;outline-color:#00442D}
.search-wrap .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:.85rem}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-group select{font-family:Inter;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:.78rem;background:#fff;outline-color:#00442D;cursor:pointer}
/* ─── ORDERS LIST ─── */
.section-title{font-size:.85rem;font-weight:700;color:#00442D;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.section-title .count{font-size:.7rem;color:#5c5c5c;font-weight:500}
.order-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:all .15s;position:relative}
.order-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.order-number{font-weight:700;font-size:.9rem;color:#00442D}
.order-time{font-size:.7rem;color:#888}
.order-body{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.order-info{display:flex;flex-direction:column;gap:4px}
.order-customer{font-weight:600;font-size:.88rem}
.order-details{font-size:.78rem;color:#5c5c5c;line-height:1.5}
.order-details span{display:inline-block;margin-right:12px}
.order-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;padding:3px 8px;border-radius:999px;font-weight:500}
.tag-building{background:#00442D10;color:#00442D}
.tag-payment{background:#c9a22715;color:#8a6e15}
.tag-slot{background:#e8f4f0;color:#00442D}
.tag-notes{background:#f5f5f5;color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.order-total{font-weight:700;font-size:1.05rem;color:#1a1a1a;white-space:nowrap}
.order-total small{font-size:.65rem;font-weight:500;color:#888}
/* ─── STATUS BADGE & BUTTONS ─── */
.status-badge{font-size:.7rem;padding:4px 10px;border-radius:999px;font-weight:600;display:inline-block;text-align:center}
.status-received{background:#e8f4f0;color:#00442D}
.status-confirmed{background:#d4edda;color:#155724}
.status-picked{background:#fff3cd;color:#856404}
.status-delivered{background:#cce5ff;color:#004085}
.status-completed{background:#0a6b47;color:#fff}
.status-cancelled{background:#f8d7da;color:#721c24}
.status-bar{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.status-bar button{font-size:.68rem;padding:5px 10px;border-radius:6px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-weight:500;font-family:Inter;transition:all .12s}
.status-bar button.active{background:#00442D;color:#fff;border-color:#00442D}
.status-bar button.completed-prev{background:#0a6b47;color:#fff;border-color:#0a6b47;opacity:.6}
.status-bar button:disabled{opacity:.5;cursor:not-allowed}
.status-bar .wa-btn{background:#25D366;color:#fff;border-color:#25D366;margin-left:auto}
.status-bar .wa-btn:hover{background:#1da851}
/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h2{color:#00442D;font-size:1.1rem;font-weight:700;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.72rem;color:#5c5c5c;font-weight:500}
.form-group input,.form-group select,.form-group textarea{font-family:Inter;padding:9px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:.82rem;outline-color:#00442D;background:#fff}
.form-group textarea{resize:vertical;min-height:50px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#00442D}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:40px 16px;color:#888}
.empty-state .big-icon{font-size:2.5rem;margin-bottom:8px}
.empty-state p{font-size:.9rem}
/* ─── TOAST ─── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00442D;color:#fff;padding:10px 24px;border-radius:10px;font-size:.82rem;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* ─── EXPORT OVERLAY ─── */
.export-area{display:none}
/* ─── MISC ─── */
.text-center{text-align:center}
.mt-8{margin-top:8px}
.mb-4{margin-bottom:4px}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-4{gap:4px}
/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
</head>
<body>

<!-- ───── HEADER ───── -->
<div class="header-row">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00442D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    JG Mart <span>Orders</span>
    <span class="badge-live">LIVE</span>
  </h1>
  <div class="header-actions">
    <button class="btn" onclick="openAddModal()">+ New Order</button>
    <button class="btn btn-outline btn-sm" onclick="exportJSON()">Export</button>
  </div>
</div>

<!-- ───── KPI ROW ───── -->
<div class="kpi-row" id="kpiRow">
  <div class="kpi-card"><div class="kpi-label">Today's Orders</div><div class="kpi-value" id="kpiToday">0</div></div>
  <div class="kpi-card"><div class="kpi-label">Delivered Today</div><div class="kpi-value green" id="kpiDelivered">0</div></div>
  <div class="kpi-card"><div class="kpi-label">Pending Pickup</div><div class="kpi-value gold" id="kpiPending">0</div></div>
  <div class="kpi-card"><div class="kpi-label">Avg Delivery</div><div class="kpi-value" id="kpiAvgTime">—</div></div>
  <div class="kpi-card"><div class="kpi-label">Revenue (BDT)</div><div class="kpi-value green" id="kpiRevenue">0</div></div>
</div>

<!-- ───── TOOLBAR ───── -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search order#, customer, building..." oninput="renderOrders()">
  </div>
  <div class="filter-group">
    <select id="filterStatus" onchange="renderOrders()"><option value="">All Status</option></select>
    <select id="filterPayment" onchange="renderOrders()"><option value="">All Payments</option></select>
    <select id="filterSlot" onchange="renderOrders()"><option value="">All Slots</option></select>
  </div>
</div>

<!-- ───── ORDERS CONTAINER ───── -->
<div id="ordersContainer"></div>

<!-- ───── ADD/EDIT MODAL ───── -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <h2 id="modalTitle">New Order</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Order #</label>
        <input type="text" id="fOrderNum" readonly style="background:#f5f5f5">
      </div>
      <div class="form-group">
        <label>Customer Name *</label>
        <input type="text" id="fCustomer" placeholder="e.g. Karim Ahmed">
      </div>
      <div class="form-group">
        <label>Building *</label>
        <select id="fBuilding"></select>
      </div>
      <div class="form-group">
        <label>Total (BDT) *</label>
        <input type="number" id="fTotal" placeholder="e.g. 850" min="0">
      </div>
      <div class="form-group">
        <label>Payment *</label>
        <select id="fPayment"><option value="COD">COD</option><option value="bKash">bKash</option></select>
      </div>
      <div class="form-group">
        <label>Delivery Slot *</label>
        <select id="fSlot"><option value="Morning">Morning</option><option value="Evening">Evening</option></select>
      </div>
      <div class="form-group full">
        <label>Items Summary</label>
        <input type="text" id="fItems" placeholder="e.g. Vegetables, Rice, Eggs">
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="Special instructions…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveOrder()">Save Order</button>
    </div>
  </div>
</div>

<!-- ───── EXPORT TEXTAREA ───── -->
<textarea class="export-area" id="exportArea" readonly></textarea>

<!-- ───── TOAST ───── -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ───
const STATUSES = ['Received','Confirmed','Picked Up','Delivered','Completed'];
const STATUS_KEYS = ['received','confirmed','picked','delivered','completed'];
const STORAGE_KEY = 'jgmart_orders';

let orders = [];
let editingId = null;

// ─── BUILDING DROPDOWN ───
(function(){
  const sel = document.getElementById('fBuilding');
  sel.innerHTML = '<option value="">Select Building</option>';
  for(let i=1;i<=27;i++){
    const o = document.createElement('option');
    o.value = 'Building '+i;
    o.textContent = 'Building '+i;
    sel.appendChild(o);
  }
})();

// ─── FILTER DROPDOWNS ───
(function(){
  const st = document.getElementById('filterStatus');
  STATUSES.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;st.appendChild(o)});
  ['COD','bKash'].forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;document.getElementById('filterPayment').appendChild(o)});
  ['Morning','Evening'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;document.getElementById('filterSlot').appendChild(o)});
})();

// ─── ORDER NUMBER GENERATOR ───
function generateOrderNum(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const prefix = 'JG-'+y+m+dd+'-';
  const todayOrders = orders.filter(o=>o.orderNum.startsWith(prefix));
  let seq = 1;
  if(todayOrders.length>0){
    const lastNum = todayOrders.map(o=>parseInt(o.orderNum.slice(-3),10)).sort((a,b)=>b-a)[0];
    seq = lastNum+1;
  }
  return prefix+String(seq).padStart(3,'0');
}

// ─── LOAD / SAVE ───
function loadOrders(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    orders = raw ? JSON.parse(raw) : [];
  }catch(e){orders=[]}
}
function saveOrders(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
}

// ─── HELPERS ───
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatTime(iso){
  if(!iso)return '';
  const d=new Date(iso);
  const h=d.getHours(), m=d.getMinutes();
  const ampm=h>=12?'PM':'AM';
  return String(h%12||12).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ampm;
}
function formatDate(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return d.toLocaleDateString('en-BD',{day:'numeric',month:'short',year:'numeric'});
}
function isToday(iso){
  if(!iso)return false;
  const d=new Date(iso);
  const t=new Date();
  return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();
}
function statusIndex(s){
  const idx = STATUSES.indexOf(s);
  return idx>=0?idx:-1;
}
function nextStatus(s){
  const idx = STATUSES.indexOf(s);
  if(idx>=0&&idx<STATUSES.length-1) return STATUSES[idx+1];
  return null;
}

// ─── STATUS CLASS ───
function statusClass(s){
  const map = {'Received':'status-received','Confirmed':'status-confirmed','Picked Up':'status-picked','Delivered':'status-delivered','Completed':'status-completed'};
  return map[s]||'status-received';
}

// ─── WHATSAPP MESSAGE ───
function waMsg(order){
  const status = order.status;
  let msg = `*JG Mart - Order Update*\n`;
  msg += `Order: ${order.orderNum}\n`;
  msg += `Customer: ${order.customer}\n`;
  msg += `Building: ${order.building}\n`;
  msg += `Items: ${order.items||'—'}\n`;
  msg += `Total: ৳${order.total}\n`;
  msg += `Payment: ${order.payment}\n`;
  msg += `Slot: ${order.slot}\n`;
  msg += `Status: *${status}*\n`;
  if(status==='Confirmed') msg += `\n✅ Your order has been confirmed! We'll start picking your items shortly.`;
  else if(status==='Picked Up') msg += `\n🛵 Your order has been picked up and is on the way!`;
  else if(status==='Delivered') msg += `\n📦 Your order has been delivered! Thank you for choosing JG Mart.`;
  else if(status==='Completed') msg += `\n✅ Order complete! Thank you for your order. 🙏`;
  else msg += `\nWe'll keep you updated on your order.`;
  return encodeURIComponent(msg);
}

// ─── RENDER ───
function renderOrders(){
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const fStatus = document.getElementById('filterStatus').value;
  const fPay = document.getElementById('filterPayment').value;
  const fSlot = document.getElementById('filterSlot').value;

  let filtered = orders.filter(o=>{
    if(fStatus && o.status!==fStatus) return false;
    if(fPay && o.payment!==fPay) return false;
    if(fSlot && o.slot!==fSlot) return false;
    if(search){
      const hay = (o.orderNum+' '+o.customer+' '+o.building+' '+(o.items||'')).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  // Split today vs past
  const today = filtered.filter(o=>isToday(o.createdAt));
  const past = filtered.filter(o=>!isToday(o.createdAt));

  // Sort today: Received first, then by status progression
  today.sort((a,b)=>{
    const ia = statusIndex(a.status);
    const ib = statusIndex(b.status);
    if(ia!==ib) return ia-ib;
    return new Date(b.createdAt)-new Date(a.createdAt);
  });
  past.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const container = document.getElementById('ordersContainer');
  let html = '';
  if(today.length>0){
    html += `<div class="section-title">📋 Today's Orders <span class="count">(${today.length})</span></div>`;
    today.forEach(o=>{html+=orderCardHTML(o)});
  }
  if(past.length>0){
    html += `<div class="section-title">📦 Past Orders <span class="count">(${past.length})</span></div>`;
    past.forEach(o=>{html+=orderCardHTML(o)});
  }
  if(!today.length&&!past.length){
    html = `<div class="empty-state"><div class="big-icon">📭</div><p>No orders found${search?' matching "'+search+'"':''}.</p></div>`;
  }
  container.innerHTML = html;

  // Update KPIs
  updateKPIs();
}

function orderCardHTML(o){
  const idx = statusIndex(o.status);
  let statusBtns = '';
  STATUSES.forEach((s,i)=>{
    let cls = 'btn-ghost';
    if(i===idx) cls = 'active';
    else if(i<idx) cls = 'completed-prev';
    if(i<=idx||i>idx+1) statusBtns += `<button class="${cls}" disabled>${s}</button>`;
    else statusBtns += `<button class="btn-ghost" onclick="advanceStatus('${o.id}')">${s} →</button>`;
  });
  statusBtns += `<button class="btn-sm wa-btn" onclick="sendWA('${o.id}')" title="Send WhatsApp Update">📱</button>`;

  const isEditable = o.status!=='Completed'&&o.status!=='Cancelled';

  return `
  <div class="order-card fade-in">
    <div class="order-top">
      <div>
        <span class="order-number">${o.orderNum}</span>
        <span class="order-time">${formatDate(o.createdAt)} ${formatTime(o.createdAt)}</span>
      </div>
      <span class="status-badge ${statusClass(o.status)}">${o.status}</span>
    </div>
    <div class="order-body">
      <div class="order-info">
        <div class="order-customer">${esc(o.customer)}</div>
        <div class="order-details">${esc(o.items||'—')}</div>
        <div class="order-meta">
          <span class="tag tag-building">🏢 ${esc(o.building)}</span>
          <span class="tag tag-payment">${o.payment==='bKash'?'💳':'💵'} ${o.payment}</span>
          <span class="tag tag-slot">${o.slot==='Morning'?'🌅':'🌙'} ${o.slot}</span>
          ${o.notes?`<span class="tag tag-notes">📝 ${esc(o.notes)}</span>`:''}
        </div>
      </div>
      <div class="order-actions">
        <div class="order-total">৳${Number(o.total).toLocaleString()} <small>BDT</small></div>
        <div style="display:flex;gap:4px;margin-top:4px">
          ${isEditable?`<button class="btn-sm btn-ghost" onclick="editOrder('${o.id}')" title="Edit">✏️</button>`:''}
          <button class="btn-sm btn-danger" onclick="deleteOrder('${o.id}')" title="Delete" style="padding:4px 8px;font-size:.7rem">🗑️</button>
        </div>
      </div>
    </div>
    <div class="status-bar">${statusBtns}</div>
  </div>`;
}

function esc(s){
  if(!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─── KPI ───
function updateKPIs(){
  const today = orders.filter(o=>isToday(o.createdAt));
  const delivered = today.filter(o=>o.status==='Delivered'||o.status==='Completed');
  const pending = today.filter(o=>o.status==='Received'||o.status==='Confirmed'||o.status==='Picked Up');
  const completedToday = today.filter(o=>o.status==='Completed');
  const rev = today.reduce((sum,o)=>sum+Number(o.total||0),0);

  document.getElementById('kpiToday').textContent = today.length;
  document.getElementById('kpiDelivered').textContent = delivered.length;
  document.getElementById('kpiPending').textContent = pending.length;
  document.getElementById('kpiRevenue').textContent = '৳'+rev.toLocaleString();

  // Avg delivery time: for completed today, calc minutes from creation to status change to Completed
  const completed = today.filter(o=>o.status==='Completed'&&o.completedAt);
  let avgMin = '—';
  if(completed.length>0){
    const totalMin = completed.reduce((sum,o)=>{
      const created = new Date(o.createdAt);
      const done = new Date(o.completedAt);
      return sum + (done-created)/60000;
    },0);
    const avg = Math.round(totalMin/completed.length);
    if(avg<60) avgMin = avg+' min';
    else avgMin = Math.floor(avg/60)+'h '+ (avg%60)+'min';
  }
  document.getElementById('kpiAvgTime').textContent = avgMin;
}

// ─── STATUS ADVANCE ───
function advanceStatus(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  const ns = nextStatus(o.status);
  if(!ns) return;
  o.status = ns;
  if(ns==='Completed'){
    o.completedAt = new Date().toISOString();
  }
  saveOrders();
  renderOrders();
  showToast('Order '+o.orderNum+' → '+ns);
}

// ─── MODAL ───
function openAddModal(){
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Order';
  document.getElementById('fOrderNum').value = generateOrderNum();
  document.getElementById('fCustomer').value = '';
  document.getElementById('fBuilding').value = '';
  document.getElementById('fTotal').value = '';
  document.getElementById('fPayment').value = 'COD';
  document.getElementById('fSlot').value = 'Morning';
  document.getElementById('fItems').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('orderModal').classList.add('active');
}
function closeModal(){
  document.getElementById('orderModal').classList.remove('active');
}
function editOrder(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Order — '+o.orderNum;
  document.getElementById('fOrderNum').value = o.orderNum;
  document.getElementById('fCustomer').value = o.customer;
  document.getElementById('fBuilding').value = o.building;
  document.getElementById('fTotal').value = o.total;
  document.getElementById('fPayment').value = o.payment;
  document.getElementById('fSlot').value = o.slot;
  document.getElementById('fItems').value = o.items||'';
  document.getElementById('fNotes').value = o.notes||'';
  document.getElementById('orderModal').classList.add('active');
}
function saveOrder(){
  const customer = document.getElementById('fCustomer').value.trim();
  const building = document.getElementById('fBuilding').value;
  const total = document.getElementById('fTotal').value;
  const payment = document.getElementById('fPayment').value;
  const slot = document.getElementById('fSlot').value;
  const items = document.getElementById('fItems').value.trim();
  const notes = document.getElementById('fNotes').value.trim();

  if(!customer){showToast('⚠️ Customer name is required');return}
  if(!building){showToast('⚠️ Please select a building');return}
  if(!total||Number(total)<=0){showToast('⚠️ Enter a valid total (BDT)');return}

  if(editingId){
    const o = orders.find(x=>x.id===editingId);
    if(o){
      o.customer = customer;
      o.building = building;
      o.total = total;
      o.payment = payment;
      o.slot = slot;
      o.items = items;
      o.notes = notes;
      o.updatedAt = new Date().toISOString();
    }
  } else {
    const order = {
      id: 'ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      orderNum: document.getElementById('fOrderNum').value,
      customer,
      building,
      total: Number(total),
      payment,
      slot,
      items,
      notes,
      status: 'Received',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      completedAt: null
    };
    orders.unshift(order);
  }
  saveOrders();
  closeModal();
  renderOrders();
  showToast(editingId?'✅ Order updated':'✅ New order created');
}

// ─── DELETE ───
function deleteOrder(id){
  if(!confirm('Delete this order? This cannot be undone.')) return;
  orders = orders.filter(o=>o.id!==id);
  saveOrders();
  renderOrders();
  showToast('🗑️ Order deleted');
}

// ─── WHATSAPP ───
function sendWA(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  const msg = waMsg(o);
  window.open('https://wa.me/?text='+msg, '_blank');
}

// ─── EXPORT ───
function exportJSON(){
  const data = JSON.stringify({exportedAt:new Date().toISOString(),orders},null,2);
  const blob = new Blob([data],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jgmart_orders_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 Orders exported as JSON');
}

// ─── TOAST ───
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._toast);
  el._toast = setTimeout(()=>el.classList.remove('show'),2500);
}

// ─── MODAL CLOSE ON CLICK OUTSIDE ───
document.getElementById('orderModal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

// ─── INIT ───
loadOrders();
renderOrders();

// Auto-refresh KPI every 30s (in case page stays open)
setInterval(renderOrders, 30000);
</script>

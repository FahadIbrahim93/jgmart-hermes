<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
body{font-family:monospace;background:#0f1a14;color:#e0e0e0;padding:20px;max-width:900px;margin:0 auto;line-height:1.6}
pre{background:#1a1a1a;padding:16px;border-radius:8px;overflow-x:auto;border:1px solid #333}

<body>
<h1>JG Mart — JSON-LD Structured Data Snippets</h1>
<p style="color:#aaa;margin-bottom:20px">Copy these <code>&lt;script type="application/ld+json"&gt;</code> blocks into the <code>&lt;head&gt;</code> of each page as indicated.</p>

<h2>1. Organization (all pages)</h2>
<pre>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "JG Mart",
  "url": "https://jgmart.bd",
  "logo": "https://jgmart.bd/favicon.svg",
  "description": "Hyperlocal grocery delivery in Japan Garden City, Mohammadpur, Dhaka. Fresh produce, daily essentials, and household staples delivered to your door.",
  "telephone": "+8801870489448",
  "areaServed": {
    "@type": "City",
    "name": "Dhaka",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Japan Garden City, Mohammadpur",
      "addressRegion": "Dhaka",
      "addressCountry": "BD"
    }
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+8801870489448",
    "contactType": "customer service",
    "availableLanguage": ["en", "bn"]
  },
  "sameAs": [
    "https://wa.me/8801870489448"
  ]
}
</script>
</pre>

<h2>2. Local Business (index.html + landing.html)</h2>
<pre>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "JG Mart",
  "image": "https://jgmart.bd/favicon.svg",
  "url": "https://jgmart.bd",
  "telephone": "+8801870489448",
  "description": "Hyperlocal grocery delivery in Japan Garden City, Mohammadpur, Dhaka. Fresh produce, daily essentials, and household staples delivered to your door.",
  "priceRange": "৳",
  "areaServed": {
    "@type": "City",
    "name": "Dhaka",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Japan Garden City, Mohammadpur",
      "addressRegion": "Dhaka",
      "addressCountry": "BD"
    }
  },
  "openingHours": "Mo-Su 08:00-22:00",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Grocery Delivery",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Product",
          "name": "Fresh Vegetables",
          "category": "Groceries"
        }
      }
    ]
  }
}
</script>
</pre>

<h2>3. BreadcrumbList (all pages)</h2>
<pre>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://jgmart.bd"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Catalog",
      "item": "https://jgmart.bd/index.html"
    }
  ]
}
</script>
</pre>

</body>
</html>

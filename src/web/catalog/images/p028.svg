<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(30)">
      <stop offset="0%" style="stop-color:#85C1E9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A5276;stop-opacity:1"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="300" height="220" fill="url(#g)" rx="8"/>
  <circle cx="150" cy="95" r="50" fill="rgba(255,255,255,0.12)"/>
  <text x="150" y="98" font-family="Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif" font-size="72" fill="rgba(255,255,255,0.95)" text-anchor="middle" dominant-baseline="central" filter="url(#s)">🐟</text>
  <text x="150" y="155" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="15" fill="#EBF5FB" text-anchor="middle" font-weight="700" dominant-baseline="central">Pangash Fish</text>
  <text x="150" y="195" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="12" fill="#D4E6F1" text-anchor="middle" font-weight="500" dominant-baseline="central">Fish</text>
  <text x="150" y="210" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="10" fill="#D4E6F1" text-anchor="middle" font-weight="500" dominant-baseline="central" opacity="0.7">মাছ</text>
</svg>
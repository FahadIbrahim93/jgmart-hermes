<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  
  <!-- Category indicator bar -->
  <rect x="0" y="0" width="400" height="8" fill="#00442D" rx="16"/>
  
  <!-- Emoji area -->
  <text x="200" y="180" text-anchor="middle" font-size="120" dominant-baseline="middle">🍚</text>
  
  <!-- Product name -->
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#5D4037">White Sugar</text>
  
  <!-- JG Mart branding -->
  <text x="200" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00442D">JG Mart</text>
  
  <!-- Price placeholder (admin can update) -->
  <text x="200" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#c9a227">৳ ---</text>
  
  <!-- Corner accent -->
  <circle cx="360" cy="40" r="30" fill="#c9a227" opacity="0.2"/>
  <text x="360" y="45" text-anchor="middle" font-size="16">⭐</text>
</svg>
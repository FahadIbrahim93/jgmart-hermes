body{font-family:Inter,system-ui,sans-serif;color:#1a1a1a;background:#f5f7f5;max-width:800px;margin:0 auto;padding:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px;margin-bottom:8px;flex-wrap:wrap;gap:6px}

.order-item{display:flex;justify-content:space-between;padding:2px 8px;font-size:.68rem;border-bottom:1px dotted #e0e8e0}
.order-item .name{font-weight:500}
.order-item .qty{font-weight:600;color:#00442D}
.order-item .total{font-weight:700;color:#1a1a1a}
.order-item .flat{color:#5c5c5c;margin:0 4px}
.order-item .phone{color:#5c5c5c;font-size:.6rem}

.summary div .num{font-size:1.1rem;font-weight:800;color:#c9a227}

body{background:#fff;padding:0}
.toolbar button{display:none}
.toolbar h1{font-size:.95rem}
.summary{padding:6px 10px}
.cluster{margin-bottom:6px}
@page{margin:0.3in}
}

<body>

<div class="toolbar">
<h1>JG <span>Mart</span> · Delivery Manifest</h1>
<div>
<button onclick="markAllDelivered()" style="background:#27ae60;margin-right:4px">✅ Mark All Delivered</button>
<button onclick="window.print()">🖨️ Print</button>
<button onclick="location.reload()" style="margin-left:4px">🔄 Refresh</button>
</div>
</div>

<div class="date-badge" id="dateBadge"></div>

<div id="summaryRow" class="summary"></div>

<div id="clusters"></div>

<div class="footer">JG Mart · Fresh Groceries · Japan Garden City · Printed automatically</div>

<script src="data-store.js"></script>
<script nonce="gscb6Xp2nALPgenhRE7XtA"
const ORDERS = JG_DATA_STORE.orders.get();
const today = new Date().toLocaleDateString('en-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('dateBadge').textContent = '📅 '+today;

const CLUSTERS = [
{id:'C1',name:'Cluster 1',bldgs:[1,2,3,4,5,6],fee:'Free'},
{id:'C2',name:'Cluster 2',bldgs:[7,8,9,10,11,12,13],fee:'Free'},
{id:'C3',name:'Cluster 3',bldgs:[14,15,16,17,18,19,20],fee:'৳20'},
{id:'C4',name:'Cluster 4',bldgs:[21,22,23,24,25,26,27],fee:'৳30'}
];

// Filter today's orders (or show all if none today)
const todayStr = new Date().toLocaleDateString('en-BD');
const todayOrders = ORDERS.filter(o => o.date === todayStr);
const showOrders = todayOrders.length ? todayOrders : ORDERS.slice(0,50);
const label = todayOrders.length ? "Today's Deliveries" : "All Recent Orders (no orders today)";

// Summary
const total = showOrders.length;
const items = showOrders.reduce((s,o) => s + (o.items?.reduce((a,i) => a + (i.qty||0),0)||0), 0);
const revenue = showOrders.reduce((s,o) => s + (o.total||o.sub||0), 0);
document.getElementById('summaryRow').innerHTML = `
<div><div class="num">${total}</div><div class="lbl">Orders Today</div></div>
<div><div class="num">${items}</div><div class="lbl">Items</div></div>
<div><div class="num">৳${revenue.toLocaleString()}</div><div class="lbl">Revenue</div></div>
`;

// Group by cluster
const el = document.getElementById('clusters');
let hasAny = false;

CLUSTERS.forEach(cluster => {
const bldgOrders = {};
cluster.bldgs.forEach(b => {
const ords = showOrders.filter(o => {
const bn = parseInt((o.building||'').replace('B',''));
return bn === b;
});
if(ords.length) bldgOrders[b] = ords;
});

const bldgKeys = Object.keys(bldgOrders);
if(!bldgKeys.length) return;
hasAny = true;

let html = `<div class="cluster"><h2>${cluster.name} <span class="fee">Delivery: ${cluster.fee}</span></h2>`;
bldgKeys.sort((a,b)=>a-b).forEach(b => {
const ords = bldgOrders[b];
html += `<div class="building"><h3>🏢 Building ${b} (${ords.length} order${ords.length>1?'s':''})</h3>`;
ords.forEach(o => {
const items = o.items?.map(i => i.nm+' ×'+i.qty).join(', ')||'';
const status = o.status || 'Received ✅';
html += `<div class="order-item">
<span><span class="name">${items}</span></span>
<span><span class="flat">Flat ${o.flat||'—'}</span>${o.phone?`<span class="phone"> 📞${o.phone}</span>`:''} <span class="total">৳${o.total||o.sub||0}</span> <span style="font-size:.58rem;color:#5c5c5c">${status}</span></span>
</div>`;
});
html += `</div>`;
});
html += `</div>`;
el.innerHTML += html;
});

if(!hasAny){
el.innerHTML = '<div class="empty">📭 No orders to deliver today. Great!</div>';
}

function markAllDelivered(){
if(!confirm('Mark all visible orders as delivered?')) return;
showOrders.forEach(o => { o.status = 'delivered'; });
JG_DATA_STORE.orders.set(ORDERS);
location.reload();
}
</script>
</body>
</html>

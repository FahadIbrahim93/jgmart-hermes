<style>
:root {
  --green-deep: #00442D;
  --green-mid: #0a5a3e;
  --green-light: #063d2a;
  --gold: #c9a227;
  --gold-light: #e8c94a;
  --whatsapp: #25D366;
  --bg: #f0f4f0;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-muted: #5c5c5c;
  --text-light: #9ca3af;
  --border: rgba(0,0,0,0.06);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --shadow-xl: 0 20px 60px rgba(0,0,0,0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: linear-gradient(135deg, var(--green-deep), var(--green-light));
  color: #fff;
  padding: 20px 16px;
  text-align: center;
  box-shadow: 0 2px 12px rgba(0,68,45,0.2);
}

.header h1 {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.3px;
}

.header p {
  font-size: 0.78rem;
  opacity: 0.8;
  margin-top: 4px;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}

.lookup { margin-bottom: 16px; }

.lookup input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e5e7eb;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-family: inherit;
  margin-bottom: 10px;
  transition: all 0.2s var(--ease);
  background: #fafafa;
}

.lookup input:focus {
  outline: none;
  border-color: var(--green-deep);
  box-shadow: 0 0 0 3px rgba(0,68,45,0.1);
  background: #fff;
}

.lookup button {
  width: 100%;
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  color: #fff;
  border: none;
  padding: 13px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 8px;
  transition: all 0.2s var(--ease);
  box-shadow: 0 4px 12px rgba(0,68,45,0.2);
}

.lookup button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0,68,45,0.3);
}

.demo-btn {
  background: none;
  border: none;
  color: var(--green-deep);
  font-size: 0.78rem;
  text-decoration: underline;
  cursor: pointer;
  font-family: inherit;
  display: block;
  width: 100%;
  text-align: center;
  padding: 4px;
}

.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-light);
}

.empty .icon {
  font-size: 3.5rem;
  margin-bottom: 14px;
  display: block;
}

/* Timeline */
.timeline {
  position: relative;
  padding-left: 28px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: linear-gradient(180deg, var(--whatsapp), #e5e7eb);
  border-radius: 1px;
}

.step {
  position: relative;
  padding-bottom: 18px;
}

.step:last-child { padding-bottom: 0; }

.step::before {
  content: '';
  position: absolute;
  left: -23px;
  top: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e5e7eb;
  border: 2.5px solid #fff;
  box-shadow: 0 0 0 1px #e5e7eb;
  transition: all 0.3s;
}

.step.done::before {
  background: var(--whatsapp);
  box-shadow: 0 0 0 1px var(--whatsapp), 0 0 8px rgba(37,211,102,0.3);
}

.step.active::before {
  background: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 0 10px rgba(201,162,39,0.3);
  animation: pulse 1.5s ease-in-out infinite;
}

.step.cancelled::before {
  background: #dc2626;
  box-shadow: 0 0 0 1px #dc2626;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 8px rgba(201,162,39,0.3); }
  50% { box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(201,162,39,0.5); }
}

.step-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--green-deep);
}

.step-meta {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.step-eta {
  font-size: 0.68rem;
  color: var(--green-deep);
  font-weight: 600;
  margin-top: 2px;
}

/* Status badges */
.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 0.7rem;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}

.status-received {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  color: #92400e;
}

.status-picked {
  background: linear-gradient(135deg, #dbeafe, #bfdbfe);
  color: #1e40af;
}

.status-delivered {
  background: linear-gradient(135deg, #d1fae5, #a7f3d0);
  color: #065f46;
}

.status-cancelled {
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  color: #991b1b;
}

.order-id {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-family: monospace;
  font-weight: 600;
}

.order-total {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--green-deep);
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f0f0f0;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  color: var(--green-deep);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 600;
  transition: color 0.2s;
}

.back:hover { color: var(--gold); }

.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  margin-left: 16px;
  color: var(--green-deep);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  transition: color 0.2s;
}

.share-btn:hover { color: var(--gold); }

.eta-box {
  background: linear-gradient(135deg, #f0fdf4, #e8f5ef);
  border: 1px solid rgba(0,68,45,0.1);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-top: 12px;
  font-size: 0.75rem;
  color: #166534;
  display: flex;
  align-items: center;
  gap: 8px;
}

.eta-box strong { color: var(--green-deep); }

.updated {
  font-size: 0.62rem;
  color: var(--text-light);
  margin-top: 8px;
  text-align: center;
  font-style: italic;
}

@media print {
  body { background: #fff; }
  .header {
    background: var(--green-deep) !important;
    color: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .card {
    box-shadow: none;
    border: 1px solid #e5e7eb;
  }
}
</style>
</head>
<body>
<div class="header">
<h1>📮 Track Your Order</h1>
<p>Enter your order ID to see live delivery status</p>
</div>
<div class="container">

<div class="card">
<div class="lookup">
<input type="text" id="orderId" placeholder="e.g. JG-ABC123" onkeypress="if(event.key==='Enter')lookup()">
<button onclick="lookup()">Track Order</button>
<button class="demo-btn" onclick="loadDemo()">👀 Try demo order</button>
</div>
</div>

<div id="result"></div>

</div>

<script src="data-store.js"></script>
<script src="order-state.js"></script>
<script nonce="gscb6Xp2nALPgenhRE7XtA">
const DEMO_ORDERS = [
  {id:'JG-DEMO1',name:'Sara Ahmed',building:'B5',flat:'3A',slot:'Morning',status:'received',date:'29 Jul 2026',time:'10:30 AM',items:['Premium Miniket Rice ×2','Farm Eggs ×1','Ruhi Fish ×1'],total:1266,eta:'Today, 12:30 PM'},
  {id:'JG-DEMO2',name:'Karim Uddin',building:'B12',flat:'2B',slot:'Evening',status:'picked',date:'28 Jul 2026',time:'3:15 PM',items:['Chicken (Broiler) ×1','Potato ×2','Onion ×1'],total:540,eta:'Today, 5:30 PM'},
  {id:'JG-DEMO3',name:'Fatima Begum',building:'B22',flat:'4C',slot:'Morning',status:'delivered',date:'27 Jul 2026',time:'9:45 AM',items:['Hilsa (Ilish) ×1','Basmati Rice ×1','Mutton ×1'],total:1890,eta:'Delivered'},
];
const STATUS_STEPS = ['received','picked','delivered'];
const STATUS_LABELS = {received:'Order Received',picked:'Picked Up',delivered:'Delivered',cancelled:'Cancelled'};

function loadDemo(){
  const demo = DEMO_ORDERS[Math.floor(Math.random()*DEMO_ORDERS.length)];
  document.getElementById('orderId').value = demo.id;
  lookup();
}

function etaText(o){
  if(o.status==='delivered') return 'Delivered';
  if(o.eta) return o.eta;
  // fallback: slot-based estimate
  const slot = (o.slot||'').toLowerCase();
  const now = new Date();
  const h = now.getHours();
  if(slot.includes('morning')) return `Estimated by ${h<10?'10:30 AM':'12:30 PM'}`;
  if(slot.includes('evening')) return `Estimated by ${h<15?'5:30 PM':'7:30 PM'}`;
  return 'Estimating...';
}

function formatNow(){
  const d = new Date();
  return d.toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function esc(s){return String(s||'').replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);}
function renderOrder(o){
  const statusIdx = STATUS_STEPS.indexOf(o.status);
  const isCancelled = o.status === 'cancelled';
  const isDemo = DEMO_ORDERS.some(d=>d.id===o.id);
  
  let stepsHtml = '';
  if(isCancelled){
    stepsHtml = '<div class="step cancelled"><div class="step-title">Order Cancelled</div><div class="step-meta">This order was cancelled</div></div>';
  } else {
    STATUS_STEPS.forEach((step, i) => {
      let cls = 'step';
      if(i < statusIdx) cls += ' done';
      else if(i === statusIdx) cls += ' active';
      const label = STATUS_LABELS[step];
      const checked = i <= statusIdx ? '✓' : '⏳';
      stepsHtml += `<div class="${cls}"><div class="step-title">${label}</div><div class="step-meta">${checked}</div></div>`;
    });
  }
  
  const badgeClass = 'status-' + o.status;
  const eta = etaText(o);
  
  // XSS note: innerHTML is used for status timeline/step markup only.
  // All user-facing text values are escaped via `esc()` above,
  // and order data comes from hardcoded DEMO_ORDERS or client localStorage.
  document.getElementById('result').innerHTML = `
  <div class="card">
  <div class="order-id">Order #${esc(o.id)} ${isDemo ? '<span style="font-size:.6rem;opacity:.6">(demo)</span>' : ''}</div>
  <span class="status-badge ${badgeClass}">${STATUS_LABELS[o.status] || esc(o.status)}</span>
  <div class="timeline">${stepsHtml}</div>
  <div class="eta-box"><strong>🕐 ETA:</strong> ${esc(eta)}</div>
  <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0">
  <div style="font-size:.75rem;color:#5c5c5c">${esc(o.date)} · ${esc(o.time||'')} · ${esc(o.building||'')} ${esc(o.flat||'')} · ${esc(o.slot||'')}</div>
  <div style="font-size:.8rem;margin-top:4px">${esc((o.items || []).join(', '))}</div>
  <div class="order-total">৳${(o.total || 0).toLocaleString()}</div>
  </div>
  <a href="https://wa.me/8801870489448" class="back">💬 Questions? WhatsApp us</a>
  <button class="share-btn" onclick="shareTrack('${esc(o.id)}')">📤 Share Tracking</button>
  <div class="updated" id="updated-${esc(o.id)}">Updated just now</div>
  </div>`;
  // live clock for "updated" label
  if(window._trackIntervals) window._trackIntervals.forEach(clearInterval);
  window._trackIntervals = [];
  const id = setInterval(()=>{
    const el = document.getElementById('updated-'+esc(o.id));
    if(!el) { clearInterval(id); return; }
    el.textContent = 'Updated ' + formatNow();
  }, 1000);
  window._trackIntervals.push(id);
}

function shareTrack(id){
  const url = window.location.href.split('?')[0] + '?order=' + encodeURIComponent(id);
  const msg = `Track my JG Mart order: ${id}\n${url}`;
  if(navigator.share){
    navigator.share({title:'JG Mart Tracking',text:msg,url}).catch(()=>{});
  } else {
    prompt('📤 Copy this link:', msg);
  }
}

function lookup(){
  const id = document.getElementById('orderId').value.trim().toUpperCase();
  const result = document.getElementById('result');
  
  if(!id){result.innerHTML='<div class="empty"><div class="icon">🔍</div><p>Please enter an order ID</p></div>';return;}
  
  const demo = DEMO_ORDERS.find(o => o.id === id);
  if(demo){renderOrder(demo);return;}
  
  const orders = JG_DATA_STORE.orders.get();
  const order = orders.find(o => o.id && o.id.toUpperCase() === id);
  if(order){renderOrder({...order, items: order.items?.map(i=>`${i.nm} ×${i.qty}`) || [], eta: order.eta || ''});return;}
  
  result.innerHTML='<div class="empty"><div class="icon">😕</div><p>Order not found. Try <b>JG-DEMO1</b> to see a demo.</p></div>';
}

// auto-load from ?order= param
(function(){
  const p = new URLSearchParams(location.search);
  const oid = p.get('order');
  if(oid){
    document.getElementById('orderId').value = oid;
    lookup();
  }
})();
</script>
</body>
</html>

  --green-deep: #00442D;
  --green-mid: #0a5a3e;
  --green-light: #063d2a;

}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  max-width: 900px;
  margin: 0 auto;
  padding: 12px;
  -webkit-font-smoothing: antialiased;
}

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}

.toolbar h1 {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--green-deep);
  letter-spacing: -0.3px;
}

.toolbar h1 span { color: var(--gold); }

.toolbar .actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.toolbar button {
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.72rem;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 2px 8px rgba(0,68,45,0.2);
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}

.toolbar button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,68,45,0.3);
}

.toolbar button.secondary {
  background: var(--bg);
  color: var(--green-deep);
  border: 1.5px solid var(--green-deep);
  box-shadow: none;
}

.toolbar button.secondary:hover {
  background: #e8f5ef;
}

.toolbar button.danger {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  box-shadow: 0 2px 8px rgba(220,38,38,0.2);
}

/* ===== INPUT ROW ===== */
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--card-bg);
  padding: 12px 16px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.input-row input {
  padding: 9px 12px;
  border: 1.5px solid #d1d5db;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-family: inherit;
  flex: 1;
  min-width: 140px;
  transition: all 0.2s var(--ease);
  background: #fafafa;
}

.input-row input:focus {
  outline: none;
  border-color: var(--green-deep);
  box-shadow: 0 0 0 3px rgba(0,68,45,0.1);
  background: #fff;
}

.input-row label {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  cursor: pointer;
}

/* ===== LEGEND ===== */
.legend {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-bottom: 10px;
  text-align: right;
  font-weight: 500;
}

/* ===== SUMMARY ===== */
.summary {
  background: linear-gradient(135deg, var(--green-deep), var(--green-light));
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-around;
  text-align: center;
  box-shadow: 0 2px 12px rgba(0,68,45,0.2);
}

.summary div .num {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
}

.summary div .lbl {
  font-size: 0.6rem;
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 2px;
  font-weight: 600;
}

/* ===== CLUSTER CARDS ===== */
.cluster {
  margin-bottom: 14px;
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  transition: all 0.25s var(--ease);
}

.cluster:hover {
  box-shadow: var(--shadow-lg);
}

.cluster h2 {
  font-size: 0.9rem;
  font-weight: 800;
  color: #fff;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: -0.3px;
}

.cluster h2 .fee {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--gold);
  background: rgba(255,255,255,0.1);
  padding: 3px 10px;
  border-radius: var(--radius-full);
}

.cluster h2 .rider {
  font-size: 0.68rem;
  font-weight: 600;
  color: #fff;
  background: rgba(201,162,39,0.25);
  padding: 3px 10px;
  border-radius: var(--radius-full);
}

/* ===== BUILDING CARDS ===== */
.building {
  margin: 0;
  border-bottom: 1px solid var(--border);
}

.building:last-child { border-bottom: none; }

.building h3 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--green-deep);
  padding: 10px 16px;
  background: #f9fafb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.building h3 .seq {
  color: var(--gold);
  font-size: 0.72rem;
  font-weight: 700;
  background: rgba(201,162,39,0.1);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

/* ===== ORDER ITEMS ===== */
.order-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 16px;
  font-size: 0.75rem;
  border-bottom: 1px dotted #e5e7eb;
  align-items: center;
  transition: background 0.15s;
}

.order-item:last-child { border-bottom: none; }

.order-item:hover { background: #f9fafb; }

.order-item .name {
  font-weight: 500;
  flex: 1;
  color: var(--text);
}

.order-item .qty {
  font-weight: 600;
  color: var(--green-deep);
  margin: 0 6px;
}

.order-item .total {
  font-weight: 700;
  color: var(--text);
  margin-right: 6px;
}

.order-item .flat {
  color: var(--text-muted);
  margin: 0 4px;
  font-size: 0.72rem;
}

.order-item .phone {
  color: var(--text-light);
  font-size: 0.68rem;
}

.order-item .status {
  font-size: 0.65rem;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  background: #e8f5ef;
  color: var(--green-deep);
  font-weight: 600;
}

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-light);
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.empty .icon {
  font-size: 3.5rem;
  margin-bottom: 14px;
  display: block;
}

.empty p {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 16px;
  font-size: 0.68rem;
  color: var(--text-light);
  margin-top: 12px;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, var(--green-deep), var(--green-light));
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.82rem;
  z-index: 300;
  box-shadow: 0 4px 16px rgba(0,68,45,0.3);
  transition: transform 0.3s var(--ease);
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ===== PRINT ===== */
@media print {
  body { background: #fff; padding: 0; }
  .toolbar button { display: none; }
  .toolbar h1 { font-size: 0.95rem; }
  .input-row { display: none; }
  .summary { padding: 8px 12px; }
  .cluster { margin-bottom: 8px; break-inside: avoid; }
  @page { margin: 0.3in; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar .actions { justify-content: stretch; }
  .toolbar button { flex: 1; text-align: center; }
  .summary { flex-direction: column; gap: 8px; }
}
</style>

<body>
<a href="#main" style="position:absolute;top:-9999px;left:-9999px;background:#00442D;color:#fff;padding:8px 16px;z-index:9999;font-weight:700;text-decoration:none" onfocus="this.style.top='0';this.style.left='0'" aria-label="Skip to main content">Skip to content</a>
<div class="toolbar">
<h1>JG <span>Mart</span> · Rider Dispatch</h1>
<div>
<button onclick="printDispatch()">🖨️ Print Route Cards</button>
<button onclick="dispatchSelected()" class="secondary">🚚 Dispatch Selected</button>
<button onclick="location.reload()" style="margin-left:4px">🔄 Refresh</button>
</div>
</div>
<div class="input-row">
<input type="text" id="riderName" placeholder="Rider name (optional)">
<label style="font-size:.7rem;color:#5c5c5c"><input type="checkbox" id="optimizeRoute" checked> Optimize route</label>
<label style="font-size:.7rem;color:#5c5c5c"><input type="checkbox" id="showAll" onchange="render()"> Show all orders</label>
</div>
<div class="legend" id="legend"></div>
<div id="summaryRow" class="summary"></div>
<div id="clusters"></div>
<div class="footer">JG Mart · Fresh Groceries · Japan Garden City · Rider Dispatch</div>
<script src="data-store.js"></script>
<script src="order-state.js"></script>
<script nonce="gscb6Xp2nALPgenhRE7XtA">
const ESC = (s) => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const ORDERS = JG_DATA_STORE.orders.get();
const todayStr = new Date().toLocaleDateString('en-BD');
const todayOrders = ORDERS.filter(o => o.date === todayStr && (o.status==='Received ✅' || !o.status));
const showAll = document.getElementById('showAll').checked;
const showOrders = (!todayOrders.length && showAll) ? ORDERS.slice(0,50) : todayOrders;
const label = todayOrders.length ? "Today's Dispatch" : (showAll ? "All Recent Orders" : "No orders today");

// Building coordinates for route optimization (approximate JGC layout)
const BLDG_POS = {
  1:{x:0,y:0},2:{x:1,y:0},3:{x:2,y:0},4:{x:3,y:0},5:{x:4,y:0},6:{x:5,y:0},
  7:{x:0,y:3},8:{x:1,y:3},9:{x:2,y:3},10:{x:3,y:3},11:{x:4,y:3},12:{x:5,y:3},13:{x:6,y:3},
  14:{x:0,y:6},15:{x:1,y:6},16:{x:2,y:6},17:{x:3,y:6},18:{x:4,y:6},19:{x:5,y:6},20:{x:6,y:6},
  21:{x:0,y:9},22:{x:1,y:9},23:{x:2,y:9},24:{x:3,y:9},25:{x:4,y:9},26:{x:5,y:9},27:{x:6,y:9}
};
const KRISHI = {x:-1,y:1.5};

function dist(a,b){return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);}

function nearestNeighborRoute(bldgs){
  if(!bldgs.length)return[];
  const optimize = document.getElementById('optimizeRoute').checked;
  if(!optimize)return bldgs.slice().sort((a,b)=>a-b);
  const unvisited = new Set(bldgs);
  const route = [];
  let current = KRISHI;
  while(unvisited.size){
    let nearest = null;
    let nearestDist = Infinity;
    unvisited.forEach(b => {
      const d = dist(current, BLDG_POS[b] || {x:b,y:0});
      if(d < nearestDist){nearestDist = d; nearest = b;}
    });
    route.push(nearest);
    current = BLDG_POS[nearest] || {x:nearest,y:0};
    unvisited.delete(nearest);
  }
  return route;
}

const CLUSTERS = [
  {id:'C1',name:'Cluster 1',bldgs:[1,2,3,4,5,6],fee:'Free'},
  {id:'C2',name:'Cluster 2',bldgs:[7,8,9,10,11,12,13],fee:'Free'},
  {id:'C3',name:'Cluster 3',bldgs:[14,15,16,17,18,19,20],fee:'৳20'},
  {id:'C4',name:'Cluster 4',bldgs:[21,22,23,24,25,26,27],fee:'৳30'}
];

// Summary
const total = showOrders.length;
const items = showOrders.reduce((s,o) => s + (o.items?.reduce((a,i) => a + (i.qty||0),0)||0), 0);
const revenue = showOrders.reduce((s,o) => s + (o.total||o.sub||0), 0);
document.getElementById('summaryRow').innerHTML = `
<div><div class="num">${total}</div><div class="lbl">${label}</div></div>
<div><div class="num">${items}</div><div class="lbl">Items</div></div>
<div><div class="num">৳${revenue.toLocaleString()}</div><div class="lbl">Revenue</div></div>
`;

// Group by cluster
const el = document.getElementById('clusters');
let hasAny = false;
const riderName = document.getElementById('riderName').value.trim() || 'Rider';

CLUSTERS.forEach(cluster => {
  const bldgOrders = {};
  cluster.bldgs.forEach(b => {
    const ords = showOrders.filter(o => {
      const bn = parseInt((o.building||'').replace('B',''));
      return bn === b;
    });
    if(ords.length) bldgOrders[b] = ords;
  });

  const bldgKeys = Object.keys(bldgOrders).map(Number);
  if(!bldgKeys.length) return;
  hasAny = true;

  // Optimize route
  const route = nearestNeighborRoute(bldgKeys);
  document.getElementById('legend').textContent = '🛵 Route: Krishi Market → ' + route.map(b => 'B'+b).join(' → ');

  let html = `<div class="cluster"><h2>${cluster.name} <span class="fee">Delivery: ${cluster.fee}</span> <span class="rider">${riderName}</span></h2>`;
  route.forEach((b, idx) => {
    const ords = bldgOrders[b];
    if(!ords) return;
    html += `<div class="building"><h3>🏢 Building ${b} <span class="seq">Stop ${idx+1}</span> (${ords.length} order${ords.length>1?'s':''})</h3>`;
    ords.forEach(o => {
      const items = o.items?.map(i => i.nm+' ×'+i.qty).join(', ')||'';
      const status = o.status || 'Received ✅';
      html += `<div class="order-item">
<span><span class="name">${ESC(items)}</span></span>
<span><span class="flat">Flat ${ESC(o.flat||'—')}</span>${o.phone?`<span class="phone"> 📞${ESC(o.phone)}</span>`:''} <span class="total">৳${ESC((o.total||o.sub||0).toString())}</span> <span class="status">${ESC(status)}</span></span>
</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  el.innerHTML += html;
});

if(!hasAny){
  el.innerHTML = '<div class="empty">📭 No orders to dispatch. Great!</div>';
}

function printDispatch(){
  window.print();
}

function dispatchSelected(){
  const rider = document.getElementById('riderName').value.trim() || 'Rider';
  if(!confirm(`Dispatch all visible orders to ${rider}? This will mark them as "Picked Up 🚚".`)) return;
  const todayStr = new Date().toLocaleDateString('en-BD');
  const targets = ORDERS.filter(o => o.date === todayStr && (o.status==='Received ✅' || !o.status));
  if(!targets.length){alert('No orders to dispatch.');return;}
  targets.forEach(o => { o.status = 'Picked Up 🚚'; });
  JG_DATA_STORE.orders.set(ORDERS);
  toast(`🚚 ${targets.length} orders dispatched to ${rider}`);
  setTimeout(()=>location.reload(), 1200);
}

function toast(m){
  const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}
</script>

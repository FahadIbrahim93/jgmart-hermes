<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG Mart — System Map</title>
<meta name="theme-color" content="#00442D">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#00442D;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:1.2rem;font-weight:800}.topbar h1 span{color:#c9a227}
.topbar .stats{font-size:.75rem;opacity:.8}
.container{max-width:1100px;margin:0 auto;padding:20px}
.map-header{margin-bottom:20px}
.map-header h2{font-size:1rem;color:#00442D;font-weight:700;margin-bottom:4px}
.map-header p{font-size:.82rem;color:#5c5c5c}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:.75rem}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot-green{background:#0a6b47}.dot-gold{background:#c9a227}.dot-blue{background:#1565c0}.dot-gray{background:#95a5a6}
.folder{background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden}
.folder-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;transition:background .1s;user-select:none}
.folder-header:hover{background:#f7fbf8}
.folder-header .name{font-weight:700;font-size:.88rem;color:#00442D;display:flex;align-items:center;gap:6px}
.folder-header .count{font-size:.7rem;color:#5c5c5c;font-weight:500;background:#f0f2f0;padding:2px 8px;border-radius:999px}
.folder-header .arrow{color:#c9a227;font-size:.75rem;transition:transform .2s}
.folder-header .arrow.open{transform:rotate(90deg)}
.folder-body{display:none;padding:0 16px 14px;border-top:1px solid #f0f0f0}
.folder-body.open{display:block}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-top:10px}
.file-card{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;transition:background .1s;cursor:pointer}
.file-card:hover{background:#f7fbf8}
.file-card .icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.file-card .info{flex:1;min-width:0}
.file-card .info .name{font-size:.78rem;font-weight:600;color:#00442D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-card .info .desc{font-size:.68rem;color:#5c5c5c;line-height:1.3}
.file-card .status{flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.search-bar{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:.85rem;margin-bottom:16px;font-family:inherit}
.search-bar:focus{border-color:#00442D;outline:none;box-shadow:0 0 0 3px rgba(0,68,45,.08)}
.count-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.count-card{background:#fff;border-radius:8px;padding:8px 14px;font-size:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.03);display:flex;align-items:center;gap:6px}
.count-card .num{font-weight:700;color:#00442D}
</style>
</head>

function renderMap(filter=''){
const container = document.getElementById('mapContainer');
const countBar = document.getElementById('countBar');
container.innerHTML = '';
let totalApps = 0, totalDocs = 0, totalScripts = 0;
let shownFolders = 0;

Object.entries(SYSTEM).forEach(([folderName, folder]) => {
// Filter files
const filtered = folder.files.filter(f => !filter || 
f.name.toLowerCase().includes(filter) || f.desc.toLowerCase().includes(filter) || folderName.toLowerCase().includes(filter));
if(!filter || filtered.length > 0 || folderName.toLowerCase().includes(filter)){
shownFolders++;
// Count for stats
folder.files.forEach(f => {
if(f.type === 'app') totalApps++;
else if(f.type === 'script') totalScripts++;
else totalDocs++;
});
// Render folder
const div = document.createElement('div');
div.className = 'folder';
div.innerHTML = `
<div class="folder-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arrow').classList.toggle('open')">
<span class="name">${folder.icon} ${folderName}</span>
<span><span class="count">${folder.files.length} files</span> <span class="arrow">▶</span></span>
</div>
<div class="folder-body${filter?' open':''}">
<div class="file-grid">
${filtered.length > 0 ? filtered.map(f => {
const dotClass = f.type === 'app' ? 'dot-green' : f.type === 'script' ? 'dot-blue' : 'dot-gold';
return `<div class="file-card" onclick="openFile('${getPath(folderName, f.name)}')">
<div class="icon">${f.type === 'app' ? '🌐' : f.type === 'script' ? '🐍' : '📄'}</div>
<div class="info"><div class="name">${f.name}</div><div class="desc">${f.desc}</div></div>
<div class="status"><span class="status-dot ${dotClass}"></span></div>
</div>`;
}).join('') : '<div style="grid-column:1/-1;padding:12px;color:#999;font-size:.8rem;text-align:center">No matching files</div>'}
</div></div>`;
container.appendChild(div);
}
});

// Stats
document.getElementById('stats').textContent = `${shownFolders} folders · ${totalApps} apps · ${totalDocs} docs · ${totalScripts} scripts`;
countBar.innerHTML = `
<span class="count-card"><span class="num">${totalApps}</span> Web Apps</span>
<span class="count-card"><span class="num">${totalDocs}</span> Documents</span>
<span class="count-card"><span class="num">${totalScripts}</span> Scripts</span>
<span class="count-card"><span class="num">${totalApps+totalDocs+totalScripts}</span> Total Files</span>
`;
}

function getPath(folder, file){
if(folder === 'ROOT (top-level)') return file;
const folderMap = {
'01_Investor_Deck':'01_Investor_Deck','02_Brand_Assets':'02_Brand_Assets',
'03_Legal_Templates':'03_Legal_Templates','04_Operations':'04_Operations',
'05_Tech_Dashboard':'05_Tech_Dashboard','06_Web_Catalog':'06_Web_Catalog',
'07_Marketing':'07_Marketing','08_Financials':'08_Financials',
'09_Data_Export':'09_Data_Export','10_Launch_Readiness':'10_Launch_Readiness',
'11_Day1_Launch_Kit':'11_Day1_Launch_Kit','12_Templates':'12_Templates'
};
return (folderMap[folder]||'') + '/' + file;
}

function openFile(path){
window.open(path, '_blank');
}

function filterMap(){
const q = document.getElementById('searchInput').value.toLowerCase();
renderMap(q);
}

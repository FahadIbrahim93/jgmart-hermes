<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="theme-color" content="#00442D">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customer Communications Log – JGC Mart</title>
<style>
  :root {
    --green: #00442D;
    --gold: #c9a227;
    --gold-light: #e8c54a;
    --white: #ffffff;
    --bg: #f5f2eb;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-light: #6b6b6b;
    --border: #e0dcd4;
    --shadow: 0 2px 8px rgba(0,0,0,0.07);
    --radius: 12px;
    --radius-sm: 8px;
    --low: #4caf50;
    --med: #ff9800;
    --high: #f44336;
    --crit: #9c27b0;
    --open: #2196f3;
    --pending: #ff9800;
    --resolved: #4caf50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{max-width:820px;width:100%;padding:16px 12px 80px}
  /* Header */
  .header{
    display:flex;align-items:center;gap:12px;margin-bottom:20px;
    background:var(--green);color:var(--white);padding:16px 20px;
    border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .header h1{font-size:1.25rem;font-weight:700;flex:1;line-height:1.3}
  .header .badge{
    background:var(--gold);color:var(--green);padding:4px 10px;
    border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap;
  }
  .btn-export{
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
    color:var(--white);padding:6px 12px;border-radius:var(--radius-sm);
    font-size:.75rem;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .btn-export:hover{background:rgba(255,255,255,.25)}

  /* KPIs */
  .kpi-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;
  }
  .kpi-card{
    background:var(--card);border-radius:var(--radius-sm);padding:12px 8px;
    text-align:center;box-shadow:var(--shadow);border-top:3px solid var(--gold);
  }
  .kpi-card .val{
    font-size:1.3rem;font-weight:800;color:var(--green);line-height:1.2;
  }
  .kpi-card .lbl{
    font-size:.65rem;color:var(--text-light);text-transform:uppercase;
    letter-spacing:.03em;margin-top:2px;
  }

  /* Filters */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;
  }
  .filters input,.filters select{
    padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:.82rem;background:var(--card);color:var(--text);flex:1;min-width:120px;
    outline:none;transition:border-color .2s;
  }
  .filters input:focus,.filters select:focus{border-color:var(--gold)}
  .filter-count{
    font-size:.75rem;color:var(--text-light);padding:8px 0 0 2px;flex:0 0 100%;
  }

  /* Add button */
  .btn-add-wrap{text-align:right;margin-bottom:12px}
  .btn-add{
    background:var(--green);color:var(--white);border:none;
    padding:10px 20px;border-radius:var(--radius-sm);font-size:.85rem;
    font-weight:600;cursor:pointer;transition:.2s;
  }
  .btn-add:hover{background:#005a3d}

  /* Modal */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    z-index:100;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.open{display:flex}
  .modal{
    background:var(--card);width:100%;max-width:520px;
    border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px 32px;
    max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal h2{
    font-size:1.1rem;color:var(--green);margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-close{
    background:none;border:none;font-size:1.5rem;cursor:pointer;
    color:var(--text-light);padding:0 4px;
  }
  .form-group{margin-bottom:14px}
  .form-group label{
    display:block;font-size:.78rem;font-weight:600;color:var(--text-light);
    margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;
  }
  .form-group input,.form-group select,.form-group textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);font-size:.88rem;background:var(--white);
    color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;
  }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
    border-color:var(--gold);
  }
  .form-group textarea{resize:vertical;min-height:70px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-submit{
    width:100%;padding:12px;background:var(--green);color:var(--white);
    border:none;border-radius:var(--radius-sm);font-size:.92rem;
    font-weight:700;cursor:pointer;transition:.2s;margin-top:4px;
  }
  .btn-submit:hover{background:#005a3d}
  .btn-cancel{
    width:100%;padding:10px;background:transparent;color:var(--text-light);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:.85rem;cursor:pointer;margin-top:8px;
  }

  /* Entries */
  .entry{
    background:var(--card);border-radius:var(--radius);padding:14px 16px;
    margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
    transition:.2s;border-left:4px solid var(--gold);
  }
  .entry:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .entry-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  }
  .entry-customer{
    font-weight:600;font-size:.92rem;color:var(--green);
  }
  .entry-meta{
    font-size:.75rem;color:var(--text-light);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;
  }
  .entry-meta span{white-space:nowrap}
  .entry-badges{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .badge{
    font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:20px;
    white-space:nowrap;letter-spacing:.02em;
  }
  .badge-type{
    background:#e8e4dc;color:var(--text-light);
  }
  .badge-channel{
    background:#e3f0ff;color:#1565c0;
  }
  .badge-priority-Low{background:#e8f5e9;color:var(--low)}
  .badge-priority-Medium{background:#fff3e0;color:var(--med)}
  .badge-priority-High{background:#fce4ec;color:var(--high)}
  .badge-priority-Critical{background:#f3e5f5;color:var(--crit)}
  .badge-status-Open{background:#e3f2fd;color:var(--open)}
  .badge-status-Pending{background:#fff3e0;color:var(--pending)}
  .badge-status-Resolved{background:#e8f5e9;color:var(--resolved)}
  .entry-summary{
    font-size:.82rem;color:var(--text);margin-top:8px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .entry-time{
    font-size:.7rem;color:var(--text-light);margin-top:6px;
  }
  /* Expanded */
  .entry.expanded .entry-summary{-webkit-line-clamp:unset;display:block}
  .entry-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .entry.expanded .entry-details{display:block}
  .detail-row{
    display:grid;grid-template-columns:90px 1fr;gap:6px;margin-bottom:6px;
    font-size:.82rem;
  }
  .detail-row .lbl{color:var(--text-light);font-weight:500}
  .detail-row .val{color:var(--text)}
  .entry-actions{
    display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;
  }
  .entry-actions button{
    padding:7px 14px;border:none;border-radius:var(--radius-sm);
    font-size:.78rem;font-weight:600;cursor:pointer;transition:.2s;
  }
  .btn-resolve{
    background:#e8f5e9;color:var(--resolved);
  }
  .btn-resolve:hover{background:#c8e6c9}
  .btn-edit{
    background:#e3f2fd;color:var(--open);
  }
  .btn-edit:hover{background:#bbdefb}
  .btn-delete{
    background:#fce4ec;color:var(--high);
  }
  .btn-delete:hover{background:#f8bbd0}

  /* Empty state */
  .empty{
    text-align:center;padding:40px 20px;color:var(--text-light);
  }
  .empty p{font-size:.9rem;margin-top:6px}

  /* Toast */
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 20px;border-radius:var(--radius-sm);
    font-size:.82rem;z-index:200;opacity:0;transition:opacity .3s;
    pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1}

  /* Responsive */
  @media(min-width:600px){
    .app{padding:24px 20px 80px}
    .kpi-row{gap:12px}
    .kpi-card{padding:16px 12px}
    .kpi-card .val{font-size:1.5rem}
    .modal-overlay{align-items:center}
    .modal{border-radius:var(--radius);max-height:85vh}
    .form-row{gap:14px}
  }
  @media(max-width:480px){
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .header h1{font-size:1.05rem}
    .entry{padding:12px 14px}
    .detail-row{grid-template-columns:1fr;gap:2px}
    .detail-row .lbl{font-size:.72rem}
    .modal{padding:20px 16px 28px}
    .entry-badges{flex:0 0 auto}
    .filters input,.filters select{min-width:80px;font-size:.78rem}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>📋 Customer Log</h1>
    <span class="badge">JGC Mart</span>
    <button class="btn-export" onclick="exportJSON()">📥 Export</button>
  </div>

  <!-- KPIs -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card"><div class="val" id="kpiToday">0</div><div class="lbl">Today</div></div>
    <div class="kpi-card"><div class="val" id="kpiOpen">0</div><div class="lbl">Open Issues</div></div>
    <div class="kpi-card"><div class="val" id="kpiRate">0%</div><div class="lbl">Response Rate</div></div>
    <div class="kpi-card"><div class="val" id="kpiAvg">—</div><div class="lbl">Avg Resolution</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search name, building..." oninput="render()">
    <select id="filterStatus" onchange="render()"><option value="">All Status</option><option>Open</option><option>Pending</option><option>Resolved</option></select>
    <select id="filterPriority" onchange="render()"><option value="">All Priority</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
    <select id="filterChannel" onchange="render()"><option value="">All Channel</option><option>WhatsApp</option><option>Phone</option><option>In-person</option><option>Building Group</option></select>
  </div>

  <!-- Add button & count -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span class="filter-count" id="resultCount">0 entries</span>
    <button class="btn-add" onclick="openAdd()">+ New Entry</button>
  </div>

  <!-- Entries -->
  <div id="entriesList"></div>

  <!-- Empty state (hidden by entries) -->
  <div class="empty" id="emptyState" style="display:none">
    <div style="font-size:2.4rem;margin-bottom:8px">📭</div>
    <p>No communications found</p>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2><span id="modalTitle">New Communication</span><button class="modal-close" onclick="closeModal()">✕</button></h2>
    <form id="entryForm" onsubmit="saveEntry(event)">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Date & Time</label>
        <input type="datetime-local" id="entryDate" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="entryName" placeholder="e.g. Hasan Ahmed" required>
        </div>
        <div class="form-group">
          <label>Building</label>
          <select id="entryBuilding" required></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Type</label>
          <select id="entryType" required>
            <option>Inquiry</option><option>Order</option><option>Complaint</option>
            <option>Follow-up</option><option>Referral</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Channel</label>
          <select id="entryChannel" required>
            <option>WhatsApp</option><option>Phone</option><option>In-person</option><option>Building Group</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Summary</label>
        <textarea id="entrySummary" placeholder="Details of the interaction..." required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="entryStatus" required>
            <option>Open</option><option>Pending</option><option>Resolved</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="entryPriority" required>
            <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-submit">Save Entry</button>
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== DATA ======
const STORAGE_KEY = 'jgcmart_commlog';
let entries = [];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) entries = JSON.parse(raw);
  }catch(e){entries=[]}
  if(!entries.length) seedSampleData();
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ====== BUILDING DROPDOWN ======
(function populateBuildings(){
  const sel = document.getElementById('entryBuilding');
  for(let i=1;i<=27;i++){
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Building ${i}`;
    sel.appendChild(opt);
  }
})();

// ====== SAMPLE DATA ======
function seedSampleData(){
  const now = new Date();
  const d = (daysAgo) => {
    const t = new Date(now);
    t.setDate(t.getDate() - daysAgo);
    t.setHours(10 + Math.floor(Math.random()*8), Math.floor(Math.random()*60), 0, 0);
    return t.toISOString().slice(0,16);
  };
  entries = [
    {id:'s1',date:d(14),customer:'Hasan Ahmed',building:'12',type:'Inquiry',channel:'WhatsApp',summary:'Asked about weekly vegetable subscription options and pricing for Building 12. Wanted to know if organic produce is available.',status:'Resolved',priority:'Low'},
    {id:'s2',date:d(12),customer:'Fatima Begum',building:'5',type:'Order',channel:'Phone',summary:'Placed order for 2kg rice, 1L mustard oil, eggs, potatoes, and mixed vegetables. Requested delivery between 8-9 AM.',status:'Resolved',priority:'Medium'},
    {id:'s3',date:d(10),customer:'Rafiq Islam',building:'8',type:'Complaint',channel:'WhatsApp',summary:'Reported missing items from yesterday\'s order — 500g paneer and 1kg onions not delivered. Requested refund or replacement.',status:'Pending',priority:'High'},
    {id:'s4',date:d(8),customer:'Nasrin Akhter',building:'3',type:'Follow-up',channel:'In-person',summary:'Followed up on the paneer refund issue. Customer was calm but wanted a definite timeline. Promised resolution within 24 hours.',status:'Resolved',priority:'Medium'},
    {id:'s5',date:d(7),customer:'Mizanur Rahman',building:'15',type:'Order',channel:'Building Group',summary:'Group order for Building 15: 8 households combined order for weekly staples. Total BDT 4,200. Coordinated via the building WhatsApp group.',status:'Resolved',priority:'Medium'},
    {id:'s6',date:d(5),customer:'Shamima Yasmin',building:'9',type:'Inquiry',channel:'WhatsApp',summary:'Asked about fish delivery schedule and whether hilsha is available on Fridays. Also asked about bulk discount for building-wide orders.',status:'Resolved',priority:'Low'},
    {id:'s7',date:d(4),customer:'Jahangir Alam',building:'20',type:'Complaint',channel:'Phone',summary:'Very upset about late delivery — order arrived 2 hours late. Said he will cancel all future orders if punctuality does not improve.',status:'Open',priority:'Critical'},
    {id:'s8',date:d(3),customer:'Ayesha Khatun',building:'7',type:'Referral',channel:'In-person',summary:'Referred her neighbor from Building 6 to JGC Mart. Neighbor wants to place a trial order. Gave referral discount code JGC-REF-7.',status:'Resolved',priority:'Low'},
    {id:'s9',date:d(1),customer:'Kamal Hossain',building:'11',type:'Follow-up',channel:'WhatsApp',summary:'Called to check if his special order for imported dates and dry fruits arrived. Requested urgent delivery before Friday for iftar party.',status:'Pending',priority:'High'},
    {id:'s10',date:d(0),customer:'Shahinur Rahman',building:'4',type:'Order',channel:'WhatsApp',summary:'New customer — first order! Placed BDT 1,850 order for groceries. Asked about delivery confirmation and payment options (cash vs mobile banking).',status:'Open',priority:'Medium'}
  ];
  saveData();
}

// ====== MODAL ======
function openAdd(){
  document.getElementById('modalTitle').textContent = 'New Communication';
  document.getElementById('editId').value = '';
  document.getElementById('entryForm').reset();
  document.getElementById('entryDate').value = new Date().toISOString().slice(0,16);
  document.getElementById('entryName').value = '';
  document.getElementById('entryBuilding').value = '1';
  document.getElementById('entryType').value = 'Inquiry';
  document.getElementById('entryChannel').value = 'WhatsApp';
  document.getElementById('entrySummary').value = '';
  document.getElementById('entryStatus').value = 'Open';
  document.getElementById('entryPriority').value = 'Medium';
  document.getElementById('modal').classList.add('open');
}

function openEdit(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  document.getElementById('modalTitle').textContent = 'Edit Communication';
  document.getElementById('editId').value = id;
  document.getElementById('entryDate').value = e.date;
  document.getElementById('entryName').value = e.customer;
  document.getElementById('entryBuilding').value = e.building;
  document.getElementById('entryType').value = e.type;
  document.getElementById('entryChannel').value = e.channel;
  document.getElementById('entrySummary').value = e.summary;
  document.getElementById('entryStatus').value = e.status;
  document.getElementById('entryPriority').value = e.priority;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

// Close on overlay click
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

// ====== SAVE ======
function saveEntry(e){
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const data = {
    id: id || 'c' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    date: document.getElementById('entryDate').value,
    customer: document.getElementById('entryName').value.trim(),
    building: document.getElementById('entryBuilding').value,
    type: document.getElementById('entryType').value,
    channel: document.getElementById('entryChannel').value,
    summary: document.getElementById('entrySummary').value.trim(),
    status: document.getElementById('entryStatus').value,
    priority: document.getElementById('entryPriority').value
  };
  if(!data.customer || !data.summary){showToast('Please fill all fields');return}

  if(id){
    const idx = entries.findIndex(x => x.id === id);
    if(idx>-1) entries[idx] = data;
  } else {
    entries.push(data);
  }
  saveData();
  render();
  closeModal();
  showToast(id ? 'Entry updated ✓' : 'Entry added ✓');
}

// ====== DELETE ======
function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  entries = entries.filter(x => x.id !== id);
  saveData();
  render();
  showToast('Entry deleted');
}

// ====== RESOLVE ======
function resolveEntry(id){
  const e = entries.find(x => x.id === id);
  if(e && e.status !== 'Resolved'){
    e.status = 'Resolved';
    saveData();
    render();
    showToast('Marked as resolved ✓');
  }
}

// ====== RENDER ======
function render(){
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const filterStatus = document.getElementById('filterStatus').value;
  const filterPriority = document.getElementById('filterPriority').value;
  const filterChannel = document.getElementById('filterChannel').value;

  let filtered = entries.filter(e => {
    if(search && !e.customer.toLowerCase().includes(search) && !`building ${e.building}`.includes(search)) return false;
    if(filterStatus && e.status !== filterStatus) return false;
    if(filterPriority && e.priority !== filterPriority) return false;
    if(filterChannel && e.channel !== filterChannel) return false;
    return true;
  });

  // Sort by date descending
  filtered.sort((a,b) => b.date.localeCompare(a.date));

  document.getElementById('resultCount').textContent = `${filtered.length} of ${entries.length} entries`;

  const list = document.getElementById('entriesList');
  const empty = document.getElementById('emptyState');

  if(!filtered.length){
    list.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.innerHTML = filtered.map(e => renderEntry(e)).join('');
  }

  updateKPI();
}

function renderEntry(e){
  const priorityClass = 'badge-priority-' + e.priority;
  const statusClass = 'badge-status-' + e.status;
  const dateObj = new Date(e.date);
  const dateStr = dateObj.toLocaleDateString('en-BD', {day:'numeric', month:'short', year:'numeric'});
  const timeStr = dateObj.toLocaleTimeString('en-BD', {hour:'2-digit', minute:'2-digit'});
  const summaryPreview = e.summary.length > 90 ? e.summary.slice(0,90) + '…' : e.summary;

  return `
    <div class="entry" onclick="toggleExpand(this)" data-id="${e.id}">
      <div class="entry-top">
        <div>
          <div class="entry-customer">${esc(e.customer)}</div>
          <div class="entry-meta">
            <span>🏢 B${e.building}</span>
            <span>📋 ${e.type}</span>
            <span>📞 ${e.channel}</span>
          </div>
        </div>
        <div class="entry-badges">
          <span class="badge badge-type">${e.type}</span>
          <span class="badge ${priorityClass}">${e.priority}</span>
          <span class="badge ${statusClass}">${e.status}</span>
        </div>
      </div>
      <div class="entry-summary">${esc(summaryPreview)}</div>
      <div class="entry-time">${dateStr} · ${timeStr}</div>
      <div class="entry-details">
        <div class="detail-row"><span class="lbl">Full Summary</span><span class="val">${esc(e.summary)}</span></div>
        <div class="entry-actions">
          ${e.status !== 'Resolved' ? `<button class="btn-resolve" onclick="event.stopPropagation();resolveEntry('${e.id}')">✓ Resolve</button>` : ''}
          <button class="btn-edit" onclick="event.stopPropagation();openEdit('${e.id}')">✎ Edit</button>
          <button class="btn-delete" onclick="event.stopPropagation();deleteEntry('${e.id}')">✕ Delete</button>
        </div>
      </div>
    </div>
  `;
}

function toggleExpand(el){
  el.classList.toggle('expanded');
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ====== KPI ======
function updateKPI(){
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const todayCount = entries.filter(e => e.date.startsWith(todayStr)).length;

  const openCount = entries.filter(e => e.status !== 'Resolved').length;

  const total = entries.length;
  const responded = entries.filter(e => e.status === 'Resolved').length;
  const rate = total ? Math.round((responded/total)*100) : 0;

  // Avg resolution time (days) for resolved entries with known date
  let totalDays = 0;
  let resolvedCount = 0;
  const now = new Date();
  entries.filter(e => e.status === 'Resolved').forEach(e => {
    const d = new Date(e.date);
    const days = (now - d) / (1000*60*60*24);
    totalDays += days;
    resolvedCount++;
  });
  const avg = resolvedCount ? (totalDays/resolvedCount).toFixed(1) + 'd' : '—';

  document.getElementById('kpiToday').textContent = todayCount;
  document.getElementById('kpiOpen').textContent = openCount;
  document.getElementById('kpiRate').textContent = rate + '%';
  document.getElementById('kpiAvg').textContent = avg;
}

// ====== EXPORT ======
function exportJSON(){
  const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `jgcmart_commlog_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported as JSON ✓');
}

// ====== TOAST ======
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ====== INIT ======
loadData();
render();
</script>

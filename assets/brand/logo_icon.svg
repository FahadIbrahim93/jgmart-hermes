<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005a3a"/>
      <stop offset="100%" stop-color="#00442D"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shopping basket icon -->
  <g transform="translate(256,240)">
    <!-- Basket handle -->
    <path d="M-40 20 Q0 -60 40 20" fill="none" stroke="#c9a227" stroke-width="12" stroke-linecap="round"/>
    <!-- Basket body -->
    <path d="M-60 20 L-50 80 L50 80 L60 20 Z" fill="none" stroke="#c9a227" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Items in basket -->
    <circle cx="-20" cy="50" r="10" fill="#c9a227" opacity="0.6"/>
    <circle cx="10" cy="55" r="8" fill="#c9a227" opacity="0.5"/>
    <rect x="15" y="40" width="12" height="14" rx="2" fill="#c9a227" opacity="0.5"/>
  </g>
  <!-- JG letters below -->
  <text x="256" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="108" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">JG</text>
  <!-- Tagline -->
  <text x="256" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#c9a227" text-anchor="middle" letter-spacing="2">MART</text>
</svg>
